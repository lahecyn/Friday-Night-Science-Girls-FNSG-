<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keyframes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">
    <div id="zona-botoes">

      <div id="arrowS-left" class="arrowS arrowS-left pos_leftS" > </div>

      <div id="arrowS-down" class="arrowS arrowS-down pos_downS">  </div>

      <div id="arrowS-up" class="arrowS arrowS-up pos_upS"> </div>

      <div id="arrowS-right" class="arrowS arrowS-right pos_rightS">  </div>

    </div>

    <img src="characters/Idle_makoto.png" id="makoto_p">

    <img src="characters/Right_makoto.png" id="right_makoto" class="escondido">

    <img src="characters/Up_makoto.png" id="up_makoto" class="escondido">

    <img src="characters/Left_makoto.png" id="left_makoto" class="escondido">

    <img src="characters/Down_makoto.png" id="down_makoto" class="escondido" style="transform: translateY(400px, 110px);">

    <img src="characters/Idle_monokuma.png" id="idle_monokuma">

    <img src="Arrows_fnf/ArrowLeftC.png" id="arrowleft">

    <img src="Arrows_fnf/ArrowDownC.png" id="arrowdown">

    <img src="Arrows_fnf/ArrowUpC.png" id="arrowup">

    <img src="Arrows_fnf/ArrowRightC.png" id="arrowright">

    <script src="javascript.js"></script>

    <div id="area-notas">
      </div>

  </div>
